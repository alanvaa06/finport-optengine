[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finport-optengine"
version = "0.7.0"
description = "Multi-asset portfolio optimization engine with mean-variance, risk parity, HRP, Black-Litterman, CVaR and more."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Alan Vazquez" }, { name = "Eduardo Ramos, CFA" }]
keywords = ["portfolio", "optimization", "finance", "quant", "risk-parity", "black-litterman", "hrp", "cvar"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
# The core solves and reports. Everything a caller can reach without asking
# for a chart, a workbook or a regression lives on these five, so
# ``pip install finport-optengine`` stays a small install; the rest is behind
# the extras below. ``matplotlib`` and ``seaborn`` used to be listed here and
# are gone rather than moved: nothing in the project imports either one.
dependencies = [
    "numpy>=1.24",
    # 2.1 is the floor because every ``pct_change`` call passes
    # ``fill_method=None``: 2.0 accepts it but warns, 2.1 is the first
    # release where it is silent, and it is the only way to get the same
    # return series out of 2.x and 3.x.
    "pandas>=2.2",
    "scipy>=1.10",
    "cvxpy>=1.4",
    # Named rather than left to cvxpy because SOLVER_FALLBACK reaches for SCS
    # by name, and 3.3.0's wheel ships an incomplete Intel oneMKL bundle:
    # importing it and solving aborts the interpreter with "Cannot load
    # libmkl_avx512.so.3 or libmkl_def.so.3" — a process death, not an
    # exception, so no fallback can catch it and no traceback says why.
    # Reproduced on GitHub's runners and in a local container; 3.2.11 is fine.
    # Drop the exclusion once a fixed release is out.
    "scs>=3.2,!=3.3.0",
    "pyyaml>=6.0",
    # In the core because it backs the *default* covariance estimator:
    # ``covariance_matrix`` shrinks with Ledoit-Wolf unless told otherwise.
    # Demoting it to an extra would mean the first call in the README fails
    # on a fresh install, or that the default silently becomes the sample
    # covariance — a change to everyone's numbers, traded for ~15MB.
    "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/alanvaa06/optimization_engine"
Repository = "https://github.com/alanvaa06/optimization_engine"
Issues = "https://github.com/alanvaa06/optimization_engine/issues"
Changelog = "https://github.com/alanvaa06/optimization_engine/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Plotly figures from ``optimization_engine.reporting.plots``. The module
# imports without it; building a figure is what raises.
viz = ["plotly>=5.17"]
# Reading and writing .xlsx. ``xlsxwriter`` writes the report workbook,
# ``openpyxl`` is the engine pandas reads one back with.
excel = ["openpyxl>=3.1", "xlsxwriter>=3.1"]
# The OLS-based benchmark-relative metrics — beta, conditional beta,
# regression stats. Only reached when a benchmark is supplied, so an
# absolute-return workflow never needs it.
stats = ["statsmodels>=0.14"]
# The MCP server, for agents that call the engine as a tool rather than
# importing it. The SDK needs Python 3.10, one minor above this package's
# own floor, so on 3.9 pip reports no compatible version — which is the
# honest failure, and why the message in mcp_server.py names the version.
mcp = ["mcp>=2.0,<3"]
ui = ["streamlit>=1.49", "ipywidgets>=8.0", "plotly>=5.17"]
# ``pyarrow`` is what pandas uses to read and write Parquet. Nothing in the
# engine's core needs it — the panel cache deliberately stores NumPy so that it
# does not — but ``--output prices.parquet`` and ``--prices panel.parquet`` do.
data = ["yfinance>=0.2.40", "pyarrow>=14.0"]
# What the CLI and the README's worked examples assume: they write .xlsx and
# draw figures, so a bare core install cannot run them end to end.
all = [
    "plotly>=5.17",
    "openpyxl>=3.1",
    "xlsxwriter>=3.1",
    "statsmodels>=0.14",
    "yfinance>=0.2.40",
    "pyarrow>=14.0",
]
# The API reference is rendered from the package's own docstrings by
# ``scripts/build_api_docs.py``. Nothing the library imports needs pdoc; only
# that script and the workflow that publishes its output do, which is why this
# is an extra and not a dev dependency — a contributor running the tests has no
# reason to install a documentation renderer.
docs = ["pdoc>=14.0"]
# ``mypy`` and ``pandas-stubs`` are what the ``typecheck`` CI job runs on. Both
# carry a marker rather than being listed bare, for two reasons that agree:
# the 3.9 and 3.10 test cells never run mypy, and pandas-stubs' current releases
# declare ``requires-python >= 3.11``, so a bare listing would send pip
# backtracking through years of stub releases on those cells to find one that
# installs. The typecheck job pins 3.11, so it gets both.
#
# The ``<2`` cap on mypy is not caution, it is arithmetic: mypy 2.x refuses
# ``python_version = "3.9"`` outright — "Python 3.9 is not supported (must be
# 3.10 or higher)" — and this package still declares 3.9 in requires-python.
# Lift the cap when that floor rises; do not lift it before.
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.11,<2; python_version >= '3.11'",
    "pandas-stubs>=2.2; python_version >= '3.11'",
    "types-PyYAML>=6.0; python_version >= '3.11'",
]

[project.scripts]
optengine = "optimization_engine.cli:main"
optengine-mcp = "optimization_engine.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
optimization_engine = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The Streamlit app and the test modules must extend sys.path so that
# ``src/`` is importable before the package is imported. That is a deliberate
# late import, not an oversight.
"app/*.py" = ["E402"]
"tests/*.py" = ["E402"]
"src/optimization_engine/ui_state.py" = ["E402"]

# Type checking runs in CI's ``typecheck`` job, which installs the project so
# that mypy resolves real imports instead of guessing at them.
[tool.mypy]
# The floor declared in requires-python, not the version mypy happens to run
# on. A 3.10-only construct that reaches ``src/`` is a broken install for every
# 3.9 user, and the test matrix only catches the ones a test actually executes.
python_version = "3.9"
warn_unused_ignores = true
no_implicit_optional = true
# Most of the scientific stack ships no type information at all — scs,
# clarabel, statsmodels, yfinance, sklearn. Without this every one of those
# imports is an error before a line of this project's own code is read.
#
# It does *not* cover PyYAML, and that is deliberate on mypy's part: stubs for
# it exist on PyPI, so mypy reports ``import-untyped`` and names the package to
# install rather than silently treating it as Any. Hence ``types-PyYAML`` in the
# ``dev`` extra — dropping it does not make the error go away, it makes the
# typecheck job fail.
ignore_missing_imports = true

# cvxpy 1.9 *does* ship ``py.typed`` — the plan that added this section says it
# does not — so mypy reads cvxpy's own source instead of treating it as
# untyped. That source uses ``match``, which cannot be parsed under
# ``python_version = "3.9"``: the run ends on a syntax error inside a
# dependency ("errors prevented further checking"), having said nothing about
# this project at all. Skipping the follow puts cvxpy back where every other
# solver dependency already is — typed as ``Any``.
[[tool.mypy.overrides]]
module = ["cvxpy.*"]
follow_imports = "skip"

# Modules whose type errors are deferred rather than fixed. The list is a
# burn-down: it may shrink, and it may not grow. Nothing in mypy enforces
# that — appending here silences a new failure just as effectively as fixing
# one — so ``tests/test_typecheck_allowlist.py`` holds it to a ceiling, and
# adding a module costs a red test instead of nothing. Everything under
# ``src/optimization_engine`` that is *not* named below type-checks clean,
# which is what keeps the ``typecheck`` job a check rather than a formality.
# To remove an entry: make the module clean, delete its line, lower the
# ceiling in that test by one.
[[tool.mypy.overrides]]
module = [
    "optimization_engine.analytics.backtest",
    "optimization_engine.analytics.performance",
    "optimization_engine.analytics.relative",
    "optimization_engine.analytics.report",
    "optimization_engine.analytics.risk",
    "optimization_engine.analytics.selection",
    "optimization_engine.backtest.calendar",
    "optimization_engine.backtest.positions",
    "optimization_engine.backtest.results",
    "optimization_engine.backtest.runner",
    "optimization_engine.backtest.sweep",
    "optimization_engine.backtest.walkforward",
    "optimization_engine.benchmark",
    "optimization_engine.cli",
    "optimization_engine.config",
    "optimization_engine.data.covariance",
    "optimization_engine.data.loader",
    "optimization_engine.data.quality",
    "optimization_engine.data.yahoo",
    "optimization_engine.engine",
    "optimization_engine.frontier",
    "optimization_engine.ingest.fields",
    "optimization_engine.ingest.panel",
    "optimization_engine.ingest.providers.file",
    "optimization_engine.ingest.providers.fmp",
    "optimization_engine.ingest.providers.fred",
    "optimization_engine.ingest.providers.sample",
    "optimization_engine.ingest.providers.tiingo",
    "optimization_engine.ingest.spec",
    "optimization_engine.optimizers._cvxpy_helpers",
    "optimization_engine.optimizers.base",
    "optimization_engine.optimizers.black_litterman",
    "optimization_engine.optimizers.cdar",
    "optimization_engine.optimizers.cvar",
    "optimization_engine.optimizers.diagnostics",
    "optimization_engine.optimizers.factory",
    "optimization_engine.optimizers.herc",
    "optimization_engine.optimizers.hrp",
    "optimization_engine.optimizers.mean_variance",
    "optimization_engine.optimizers.nco",
    "optimization_engine.reporting.plots",
    "optimization_engine.resampling",
    "optimization_engine.scenarios",
    "optimization_engine.ui_state",
    "optimization_engine.universe.eligibility",
]
ignore_errors = true
